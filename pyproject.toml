[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notebook-pipeline-demo"
version = "0.1.0"
description = "A Pandas notebook pipeline with quiet, structured, run-scoped observability"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.16,<4",
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<0.11",
    "nbformat>=5.10,<6",
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "pyarrow>=18,<25",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
run-pipeline = "notebook_pipeline.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notebook_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"
markers = ["integration: executes real Jupyter kernels"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Install logging before analysis imports, so their failures are captured too.
"notebooks/*.ipynb" = ["E402"]
# Embedded notebook source is formatted in the generated notebooks.
"scripts/build_notebooks.py" = ["E501"]
